baseURL: https://ilirium.net/
languageCode: en-us
title: Ilya Kalimulin (Ilirium) personal blog
copyright: © 2023–∞ Ilya Kalimulin (Ilirium)
theme: minima

# pagination.pagerSize specifies the maximum number of posts displayed on the
# home page. Replaces the `paginate` key, removed after Hugo 0.128.
pagination:
  pagerSize: 12

params:
  # greet specifies greeting words.
  greet: Hey! I'm Dr. Ilya Kalimulin
  # subtitle speficies a subtitle displayed right after the site title.
  subtitle:
  # switch specifies two emojis to be used as the button toggling color themes.
  switch: ["🌚", "🌝"]
  # defaultTheme specifies a default theme to be used.
  # currently available options: light, dark, system.
  defaultTheme: system
  # displayDate speficies whether or not to display post date on the home page.
  displayDate: true
  # displayDescription specifies whether or not to display post description on
  # the home page.
  displayDescription: true
  # selectable specifies if your post content can be selected.
  selectable: true
  # social is an array containing as many as social accounts to be displayed
  # in the buttom of every page.

  # author specifies your name, a slogan and your brief self-introduction.
  author:
    name: Ilya Kalimulin (Ilirium)
    avatar: https://avatars.githubusercontent.com/u/3838929?v=4
    status: I'm open to work :)
    description: |
      🧑🏻‍🔬 Senior Machine Learning Engineer 8yrs, Computer Vision, Data Science.
      
      🪪 Solid software engineering skills, Ph.D. in electronic engineering,
      3 years as a research fellow before that, co-founded a startup back then.
      
      🔮 LLM, photos, satellite images, IoT, geospatial, weather.
      
      📮 https://www.linkedin.com/in/ilirium/
      
      👉 https://github.com/ilirium

  social:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/ilirium/"
    - name: "github"
      url: "https://github.com/ilirium"
    - name: "rss"
      url: "/index.xml"

  # math plugin
  math:
    enable: false
    provider: katex

  # diagram plugin
  diagram:
    enable: false
    provider: mermaid

  # comment plugin
  comment:
    enable: false

  # Main section
  mainSections:
    - posts


# menu.main is an array containing what is used as the navigator.
menu:
  main:
    - name: "Main"
      url: "/"
      weight: 1
    - identifier: about
      name: "About"
      url: "/about/"
      weight: 2
    - identifier: wasm-demo
      name: "Demo: wasm_simple"
      url: https://ilirium.net/rust_hello_wasm/
      weight: 3
      params:
        targetBlank: true
#    - identifier: tags
#      name: "Tags"
#      weight: 2
#    - identifier: series
#      name: "Series"
#      weight: 3

# taxonomies defines ways to classify you posts. Below are some presets that
# most bloggers use, so you can replace them with whatever you like.
taxonomies:
  category: categories
  tag: tags
  series: series

# markup.highlight has two keys set to make sure that the syntax highlighting
# in your posts are rendered correctly, so do not edit them.
markup:
  highlight:
    lineNos: true
    noClasses: false

permalinks:
  posts: "/:year/:month/:day/:slug/"
